name: heliostrand_app
description: "Heliostrand NFC telemetry client for the Theo Jansen solar tracker."
publish_to: 'none'

version: 1.2.0+4

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  flutter_nfc_kit: ^3.6.2
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sentry_flutter: ^9.30.1
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/app_icon.png
