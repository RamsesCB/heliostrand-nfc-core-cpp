name: Build and Publish Packages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build and Package Java Desktop App
        run: |
          cd AplicacionJava
          mvn clean test package

      - name: Upload Java Executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: AplicacionJava-Desktop
          path: AplicacionJava/target/*-jar-with-dependencies.jar
