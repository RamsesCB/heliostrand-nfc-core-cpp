name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: C++ Firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Compile Arduino Uno Firmware
        run: pio run

      - name: Static Analysis
        run: pio check --skip-packages

  java:
    name: Java Desktop App (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and Test Java App
        run: |
          cd AplicacionJava
          mvn clean test package

      - name: Upload Java Executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: AplicacionJava-1.0.0
          path: AplicacionJava/target/*-jar-with-dependencies.jar

  flutter:
    name: Flutter Mobile App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd heliostrand_app
          flutter pub get

      - name: Analyze Flutter Code
        run: |
          cd heliostrand_app
          flutter analyze

      - name: Run Flutter Unit Tests
        run: |
          cd heliostrand_app
          flutter test
