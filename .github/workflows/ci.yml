name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware C++ / Protocol Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Generate C++ vectors from normative JSON
        run: python tools/generate_golden_vectors_header.py
      - name: Build Arduino Uno firmware
        run: pio run -e uno
      - name: Run native protocol tests
        run: pio test -e native
      - name: Static analysis
        run: pio check -e uno --skip-packages

  java:
    name: Java Desktop / JDK 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: AplicacionJava/pom.xml
      - name: Test and package
        working-directory: AplicacionJava
        run: ./mvnw --batch-mode clean test package
      - uses: actions/upload-artifact@v4
        with:
          name: AplicacionJava-1.1.0
          path: AplicacionJava/target/*-jar-with-dependencies.jar

  flutter:
    name: Flutter Mobile / 3.47.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: heliostrand_app
        run: flutter pub get
      - name: Analyze
        working-directory: heliostrand_app
        run: flutter analyze
      - name: Test
        working-directory: heliostrand_app
        run: flutter test
      - name: Build debug APK as compile check
        working-directory: heliostrand_app
        run: flutter build apk --debug
