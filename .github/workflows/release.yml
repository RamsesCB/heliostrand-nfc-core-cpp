name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build signed release from tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches project versions
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MAVEN_VERSION=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("AplicacionJava/pom.xml").getroot().findtext("{http://maven.apache.org/POM/4.0.0}version"))')
          test "$MAVEN_VERSION" = "$VERSION"
          FLUTTER_VERSION=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' heliostrand_app/pubspec.yaml)
          test "$FLUTTER_VERSION" = "$VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build and test firmware
        run: |
          python tools/generate_golden_vectors_header.py
          pio run -e uno
          pio test -e native
          mkdir -p dist
          cp .pio/build/uno/firmware.hex dist/heliostrand-firmware.hex

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: AplicacionJava/pom.xml
      - name: Test and package Java desktop
        working-directory: AplicacionJava
        run: ./mvnw --batch-mode clean test package
      - name: Collect Java artifact
        shell: bash
        run: cp AplicacionJava/target/*-jar-with-dependencies.jar "dist/AplicacionJava-${GITHUB_REF_NAME#v}-jar-with-dependencies.jar"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install Android NDK with retry
        env:
          ANDROID_NDK_VERSION: '28.2.13676358'
        run: bash tools/install_android_ndk.sh
      - name: Configure Android release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          echo "$KEYSTORE_B64" | base64 --decode > heliostrand_app/android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > heliostrand_app/android/key.properties

      - name: Analyze, test and build signed Android APK
        working-directory: heliostrand_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/heliostrand-app.apk
          flutter build apk --release --split-per-abi
      - name: Collect Android artifact and checksums
        shell: bash
        run: |
          for ABI in armeabi-v7a arm64-v8a x86_64; do
            cp "heliostrand_app/build/app/outputs/flutter-apk/app-${ABI}-release.apk" "dist/heliostrand-app-${ABI}.apk"
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish immutable GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/heliostrand-firmware.hex
            dist/AplicacionJava-*-jar-with-dependencies.jar
            dist/heliostrand-app*.apk
            dist/SHA256SUMS.txt
