; Heliostrand NFC Core - reproducible PlatformIO configuration

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr@5.3.0
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/Servo@1.3.0
    adafruit/Adafruit PN532@1.3.4

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<TheoJansenTelemetry.cpp>
test_filter = test_telemetry
