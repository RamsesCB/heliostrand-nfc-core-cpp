<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Heliostrand · arquitectura conectada</title>
  <desc id="desc">Firmware Arduino, escritorio Java y móvil Flutter comparten el contrato de telemetría NFC V2. Una base para estudiar, adaptar y construir.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0F172A"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#FBBF24"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  </defs>
  <rect width="1200" height="390" rx="24" fill="url(#bg)"/>
  <path d="M0 366H1200" stroke="url(#accent)" stroke-width="4"/>
  <g fill="none" stroke="#334155" stroke-width="1" opacity="0.7">
    <path d="M700 0V390M800 0V390M900 0V390M1000 0V390M1100 0V390M650 70H1200M650 150H1200M650 230H1200M650 310H1200"/>
    <circle cx="1150" cy="40" r="140"/><circle cx="1150" cy="40" r="190"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="54" y="61" fill="#7DD3FC" font-size="14" font-weight="700" letter-spacing="3">ROBOTICS / NFC / SOFTWARE ARCHITECTURE</text>
    <text x="50" y="127" fill="#FFFFFF" font-size="58" font-weight="800">HELIOSTRAND</text>
    <text x="54" y="166" fill="#CBD5E1" font-size="23">Una base. Tres entornos. Un contrato.</text>
    <text x="54" y="211" fill="#94A3B8" font-size="17">Explora el diseño. Reutiliza sus piezas.</text>
    <text x="54" y="238" fill="#94A3B8" font-size="17">Construye tu propia variante.</text>
    <rect x="54" y="280" width="124" height="36" rx="18" fill="#1E3A5F"/>
    <text x="116" y="303" fill="#BAE6FD" text-anchor="middle" font-size="14" font-weight="700">CÓDIGO 1.2.0</text>
    <rect x="192" y="280" width="160" height="36" rx="18" fill="#173A32"/>
    <text x="272" y="303" fill="#BBF7D0" text-anchor="middle" font-size="14" font-weight="700">PROTOCOLO NFC V2</text>
    <path d="M882 121V140M747 240V275H1072V240M921 240V275" fill="none" stroke="#64748B" stroke-width="3"/>
    <rect x="738" y="51" width="288" height="70" rx="14" fill="#15392F" stroke="#4ADE80"/>
    <text x="882" y="80" fill="#BBF7D0" text-anchor="middle" font-size="18" font-weight="700">CONTRATO COMPARTIDO</text>
    <text x="882" y="103" fill="#86EFAC" text-anchor="middle" font-size="14">12 bytes · CRC · vectores de prueba</text>
    <path d="M747 159V140H1072V159M921 140V159" fill="none" stroke="#64748B" stroke-width="3"/>
    <rect x="652" y="159" width="190" height="81" rx="12" fill="#422D12" stroke="#FBBF24"/>
    <text x="747" y="190" fill="#FDE68A" text-anchor="middle" font-size="18" font-weight="700">FIRMWARE</text>
    <text x="747" y="216" fill="#FCD34D" text-anchor="middle" font-size="14">Arduino · C++</text>
    <rect x="858" y="159" width="126" height="81" rx="12" fill="#2E2255" stroke="#A78BFA"/>
    <text x="921" y="190" fill="#DDD6FE" text-anchor="middle" font-size="17" font-weight="700">DESKTOP</text>
    <text x="921" y="216" fill="#C4B5FD" text-anchor="middle" font-size="14">Java · Swing</text>
    <rect x="1000" y="159" width="145" height="81" rx="12" fill="#12354B" stroke="#38BDF8"/>
    <text x="1072" y="190" fill="#BAE6FD" text-anchor="middle" font-size="17" font-weight="700">MOBILE</text>
    <text x="1072" y="216" fill="#7DD3FC" text-anchor="middle" font-size="14">Flutter · Dart</text>
    <text x="895" y="313" fill="#CBD5E1" text-anchor="middle" font-size="16">ADQUIRIR  /  VALIDAR  /  VISUALIZAR</text>
